# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agridoc_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: agridoc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

# --- New S3/MinIO Storage ---
  minio:
    image: minio/minio:latest
    container_name: agridoc-minio
    ports:
      - "9000:9000" # API port (NestJS will use this to talk to MinIO)
      - "9001:9001" # Web Console port 
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}           #  AWS Access Key
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD} #  AWS Secret Key
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
volumes:
  postgres_data:
  minio_data:
    driver: local